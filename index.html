<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>START 現場檢傷傷情卡產生器 (A4六人縱向列印)</title>
    <meta name="description" content="專業大量傷病患 START 檢傷分類傷情卡產生器，支援手動指定紅黃綠黑人數、自動統計、精確 A4 縱向六人傷卡排版與 PDF 匯出列印存檔。" />
    <meta property="og:title" content="START 現場檢傷傷情卡產生器 (A4六人縱向列印)" />
    <meta property="og:description" content="專業大量傷病患 START 檢傷分類傷情卡產生器，支援手動指定紅黃綠黑人數、自動統計、精確 A4 縱向六人傷卡排版與 PDF 匯出列印存檔。" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // 確保 GitHub Pages 子路徑訪問時有尾部斜線，使 ./assets/ 能正確解析，避免白畫面
      try {
        var loc = window.location;
        var path = loc.pathname;
        if (path && path.length > 1 && !path.endsWith('/') && !path.split('/').pop().includes('.')) {
          // 僅在非 iframe 環境下執行，避免在嵌入預覽時陷入重定向白畫面
          if (window.self === window.top) {
            loc.replace(path + '/' + loc.search + loc.hash);
          }
        }
      } catch (e) {
        // 忽略沙盒限制錯誤，避免中斷後續腳本載入
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
